name: Build TikTok Sandbox Test Media

on:
  push:
    paths:
      - "ops/tiktok-sandbox-media-trigger.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Build clean sandbox MP4
        run: |
          ffmpeg -y \
            -f lavfi -i "testsrc2=size=720x1280:rate=30:duration=5" \
            -c:v libx264 -pix_fmt yuv420p -preset medium -crf 23 \
            -movflags +faststart \
            -an \
            tiktok-sandbox-test.mp4
          ffprobe -v error -show_entries format=duration,size -of json tiktok-sandbox-test.mp4

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok-sandbox-test.mp4
          if git diff --cached --quiet; then
            echo "No media change to commit."
            exit 0
          fi
          git commit -m "Build TikTok sandbox test media"
          git push
